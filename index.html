T("لعرض بيانات الجدول يتم الضغط على View.","To display the table data, click View.",1),

T("حقل «عنوان الطالب» يكون من نوع AutoNumber.","The “student address” field is of AutoNumber type.",0)]}];
let name="",ci=0;const $=s=>document.querySelector(s),A=new(window.AudioContext||window.webkitAudioContext)();
function beep(f,d,t="sine",st=0){let o=A.createOscillator(),g=A.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(.25,A.currentTime+st);g.gain.exponentialRampToValueAtTime(.001,A.currentTime+st+d);o.connect(g);g.connect(A.destination);o.start(A.currentTime+st);o.stop(A.currentTime+st+d)}
const good=()=>{[523,659,784,1046].forEach((f,i)=>beep(f,.25,"triangle",i*.1));for(let i=0;i<8;i++){let s=document.createElement('div');s.className='s';s.textContent=["⭐","🎉","✨","👏"][i%4];s.style.left=20+Math.random()*60+"%";s.style.top="60%";document.body.appendChild(s);setTimeout(()=>s.remove(),1300)}},bad=()=>{beep(180,.3,"sawtooth");beep(120,.4,"sawtooth",.15)};
function bi(a,e,c=""){return `<div class="p ${c}"><div class="ar">${a}</div><div class="en">${e}</div></div>`}
function start(){$("#app").innerHTML=`<div class="c" style="text-align:center"><h2>أدخل اسمك للبدء<br><span style="font-size:22px">Enter your name to start</span></h2><input id="nm" placeholder="الاسم / Name"><button class="big" onclick="go()">ابدأ الدرس 🚀 Start</button></div>`}
function go(){name=$("#nm").value.trim();if(!name){$("#nm").style.outline="4px solid red";return}A.resume();show(0)}
function nav(){return `<div class="c nav">${S.map((s,i)=>`<button class="${i===ci?'on':''}" onclick="show(${i})">${i+1}. ${s.t[0]}<br><small>${s.t[1]}</small></button>`).join("")}<button style="background:#ff5e8a;color:#fff" onclick="exam()">📝 الاختبار Exam</button></div>`}
function show(i){ci=i;const s=S[i];$("#app").innerHTML=`<div class="c" style="text-align:center">👋 أهلًا ${name} / Welcome ${name}</div>`+nav()+`<div class="c"><h2>${i+1}. ${s.t[0]} – ${s.t[1]}</h2>${s.c.map(p=>bi(p[0],p[1])).join("")}<button class="big" onclick="quiz(S[${i}].q,'${s.t[0]}',0)">🎯 أسئلة هذا الجزء (5) – Quiz</button></div>`;scrollTo(0,0)}
function exam(){const all=S.flatMap(s=>[...s.q,...s.x]);quiz(all,"الاختبار النهائي – Final Exam",1)}
function quiz(L,title,ex){let n=0,sc=0,wrong=[];const q=()=>{if(n>=L.length)return end();const Q=L[n];$("#app").innerHTML=nav()+`<div class="c"><h2>${title}</h2><div class="bar"><div style="width:${n/L.length*100}%"></div></div><p>السؤال ${n+1} من ${L.length} / Question ${n+1} of ${L.length} ⭐ ${sc}</p><div class="q"><div class="ar">${Q.a}</div><div class="en">${Q.e}</div></div>${Q.o.map((o,j)=>`<button class="o" data-j="${j}">${o[0]}${o[0]!==o[1]?` &nbsp;/&nbsp; <span dir="ltr">${o[1]}</span>`:""}</button>`).join("")}</div>`;
document.querySelectorAll(".o").forEach(b=>b.onclick=()=>{let j=+b.dataset.j;document.querySelectorAll(".o").forEach(x=>x.onclick=null);if(j===Q.k){sc++;b.classList.add("ok");good()}else{b.classList.add("no");document.querySelectorAll(".o")[Q.k].classList.add("ok");bad();wrong.push(n+1)}setTimeout(()=>{n++;q()},1700)})};
const end=()=>{const p=Math.round(sc/L.length*100);if(sc/L.length>=.5){good();beep(1318,.5,"triangle",.5)}const msg=`🎓 منصة محترف MOHTARF\nالدرس الثامن: تصميم قواعد البيانات / Lesson 8: Databases Design\nالطالب / Student: ${name}\n${title}\nالنتيجة / Score: ${sc} / ${L.length} (${p}%)`;
$("#app").innerHTML=nav()+`<div class="c"><h2 style="text-align:center">🏆 ${name}</h2><div class="sc">${sc} / ${L.length}<br>${p}%</div><p style="text-align:center">${p>=85?"ممتاز! Excellent! 🌟":p>=50?"جيد، حاول مرة أخرى! Good, try again! 💪":"راجع الدرس وحاول مجددًا! Review and retry! 📚"}</p>${ex?`<button class="big" style="background:#25d366;box-shadow:0 6px 0 #128c4a" onclick="window.open('https://wa.me/201099920517?text='+encodeURIComponent(\`${msg}\`))">📲 إرسال النتيجة إلى واتساب / Send to WhatsApp</button>`:""}<button class="big" onclick="${ex?'exam()':'show(ci)'}">🔄 إعادة / Retry</button></div>`};q()}
start();
</script></body></html>
